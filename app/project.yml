name: Hush
options:
  bundleIdPrefix: dev.pitis
  deploymentTarget: { macOS: "26.0" }
settings:
  base:
    SWIFT_VERSION: "6.0"
    ARCHS: arm64
    # A stable signing identity: the Keychain only trusts rebuilds signed by the same team.
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "Apple Development"
    DEVELOPMENT_TEAM: 95KQ82C586
targets:
  Hush:
    type: application
    platform: macOS
    sources: [Hush, Generated]
    dependencies:
      - framework: Frameworks/SigCore.xcframework
        embed: false
      - sdk: Security.framework
      - sdk: SystemConfiguration.framework
      # the call engine (RingRTC/WebRTC + cubeb) inside SigCore
      - sdk: CoreAudio.framework
      - sdk: AudioToolbox.framework
      - sdk: CoreGraphics.framework
    info:
      path: Hush/Info.plist
      properties:
        CFBundleDisplayName: Hush
        LSMinimumSystemVersion: "26.0"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.pitis.hush
        ENABLE_HARDENED_RUNTIME: NO
        GENERATE_INFOPLIST_FILE: YES
        # RingRTC's WebRTC and cubeb are C++
        OTHER_LDFLAGS: ["-lc++"]
      configs:
        Release:
          # Drop unused code and strip local symbols in every Release build, not only an archive:
          # the Rust core and WebRTC otherwise ship ~35 MB of dead code and symbols (63 MB → 29 MB).
          # Global symbols stay.
          DEAD_CODE_STRIPPING: YES
          DEPLOYMENT_POSTPROCESSING: YES
          STRIP_INSTALLED_PRODUCT: YES
          STRIP_STYLE: non-global
  HushTests:
    type: bundle.unit-test
    platform: macOS
    sources: [HushTests]
    dependencies: [{ target: Hush }]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Hush:
    build: { targets: { Hush: all, HushTests: [test] } }
    test: { targets: [HushTests] }
