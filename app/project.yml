name: Semaphore
options:
  bundleIdPrefix: dev.pitis
  deploymentTarget: { macOS: "15.0" }
settings:
  base:
    SWIFT_VERSION: "6.0"
    ARCHS: arm64
    # A stable signing identity: the Keychain only trusts rebuilds signed by the same team.
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "Apple Development"
    DEVELOPMENT_TEAM: 95KQ82C586
targets:
  Semaphore:
    type: application
    platform: macOS
    sources: [Semaphore, Generated]
    dependencies:
      - framework: Frameworks/SigCore.xcframework
        embed: false
      - sdk: Security.framework
      - sdk: SystemConfiguration.framework
      # the call engine (RingRTC/WebRTC + cubeb) inside SigCore
      - sdk: CoreAudio.framework
      - sdk: AudioToolbox.framework
      - sdk: CoreGraphics.framework
    info:
      path: Semaphore/Info.plist
      properties:
        CFBundleDisplayName: Semaphore
        LSMinimumSystemVersion: "15.0"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.pitis.semaphore
        ENABLE_HARDENED_RUNTIME: NO
        GENERATE_INFOPLIST_FILE: YES
        # RingRTC's WebRTC and cubeb are C++
        OTHER_LDFLAGS: ["-lc++"]
  SemaphoreTests:
    type: bundle.unit-test
    platform: macOS
    sources: [SemaphoreTests]
    dependencies: [{ target: Semaphore }]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Semaphore:
    build: { targets: { Semaphore: all, SemaphoreTests: [test] } }
    test: { targets: [SemaphoreTests] }
