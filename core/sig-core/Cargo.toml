[package]
name = "sig-core"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"

[lib]
crate-type = ["staticlib", "lib"]

[dependencies]
uniffi = { workspace = true, features = ["tokio"] }
presage = { git = "https://github.com/whisperfish/presage", rev = "971b14bf1b7382e45bc363966e1ed588173e7c36" }
presage-store-sqlite = { git = "https://github.com/whisperfish/presage", rev = "971b14bf1b7382e45bc363966e1ed588173e7c36" }
sqlx = { version = "0.9", features = ["sqlite", "runtime-tokio", "migrate"] }
tokio = { version = "1.48", features = ["rt", "sync", "time", "macros"] }
hex = "0.4"
chrono = "0.4"
futures = "0.3"
# to tell "this device was unlinked" (a 401/403 websocket handshake) from a network error; both are
# already in the build through libsignal-service
reqwest-websocket = "0.6"
http = "1"
thiserror = "2"
tracing = "0.1"
tracing-oslog = "0.3"
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry", "env-filter"] }

[dev-dependencies]
rand = "0.9"
tokio = { version = "1.48", features = ["rt", "rt-multi-thread", "macros", "test-util"] }
