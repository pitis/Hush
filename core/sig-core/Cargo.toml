[package]
name = "sig-core"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"

[lib]
crate-type = ["staticlib", "lib"]

[dependencies]
uniffi = { workspace = true, features = ["tokio"] }
# pitis/presage's hush/upload-length: whisperfish/presage#448 (group management) and #461
# (decryption error kinds), plus our fixes that skip installed sticker packs and list their ids
# (not proposed upstream yet). #448 needs whisperfish/libsignal-service-rs#473: we pin its branch
# at 04e4e2f, rebased on upstream's #501 (attachment uploads send their length); core/Cargo.toml
# patches it to the branch's head for two group fixes.
# Back to whisperfish/presage once #448, #461 and our fixes land there.
presage = { git = "https://github.com/pitis/presage", rev = "7c72e4439cdc02067145b565b888a8b85644d9ef" }
presage-store-sqlite = { git = "https://github.com/pitis/presage", rev = "7c72e4439cdc02067145b565b888a8b85644d9ef" }
# Reads the link-and-sync history archive. Same libsignal tag as libsignal-service's pins, so
# the checkouts unify. `test-util` makes its `proto` (backup.proto types) and `export` (archive
# writing, for tests) modules public.
libsignal-message-backup = { git = "https://github.com/signalapp/libsignal", tag = "v0.99.0", features = ["test-util"] }
# Signal's call engine. `prebuilt_webrtc` downloads their checksummed libwebrtc.a for
# mac-arm64 at build time, so no WebRTC source build. Pinned by tag; bump in its own PR.
ringrtc = { git = "https://github.com/signalapp/ringrtc", tag = "v2.72.1", features = ["prebuilt_webrtc"] }
# a profile write's commitment, encoded as libsignal-service encodes it (its tag, so one copy)
zkgroup = { git = "https://github.com/signalapp/libsignal", tag = "v0.99.0" }
protobuf = "3.7.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# the history fetcher talks through libsignal-service's PushService, whose request builder and
# answers are reqwest types (already in the tree through libsignal-service)
reqwest = { version = "0.13", default-features = false, features = ["json", "stream"] }
url = "2"
# link previews fetch pages with the ring provider presage uses
rustls = { version = "0.23", default-features = false, features = ["ring"] }
sqlx = { version = "0.9", features = ["sqlite", "runtime-tokio", "migrate"] }
tokio = { version = "1.48", features = ["rt", "sync", "time", "macros", "net"] }
hex = "0.4"
# Storage Service item crypto on raw bytes (libsignal-service only offers it on decoded
# records, which would drop the fields our proto doesn't know); all already in the tree
aes-gcm = "0.11"
hkdf = "0.13"
hmac = "0.13"
sha2 = "0.11"
base64 = "0.22"
# backups: the key from the passphrase (already in the tree)
argon2 = "0.5"
# fresh IVs for the items we write
rand = "0.9"
chrono = "0.4"
futures = "0.3"
# to tell "this device was unlinked" (a 401/403 websocket handshake) from a network error; both are
# already in the build through libsignal-service
reqwest-websocket = "0.6"
http = "1"
thiserror = "2"
tracing = "0.1"
# RingRTC and WebRTC log through `log`; without this bridge a failed call leaves no trace
tracing-log = "0.2"
# blanks ids out of log lines (already in the tree through phonenumber)
regex = "1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry", "env-filter"] }

# the unified log on Apple platforms; tracing-oslog builds elsewhere but logs nothing
[target.'cfg(target_vendor = "apple")'.dependencies]
tracing-oslog = "0.3"
# a file's plain fsync, as std's is the drive-flushing F_FULLFSYNC there (already in the tree)
libc = "0.2"

[target.'cfg(not(target_vendor = "apple"))'.dependencies]
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std"] }
# SQLCipher's crypto in Rust (the fork's provider): RingRTC's prebuilt WebRTC carries BoringSSL,
# whose OpenSSL-named functions would take some of SQLCipher's OpenSSL calls and crash it on the
# first write. Apple platforms keep CommonCrypto. The version is `[patch.crates-io]`'s.
libsqlite3-sys = { version = "0.36.0", features = ["bundled-sqlcipher-custom-crypto"] }

[dev-dependencies]
tokio = { version = "1.48", features = ["rt", "rt-multi-thread", "macros", "test-util"] }
