[package]
name = "hush-desktop"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"

[[bin]]
name = "hush"
path = "src/main.rs"

[dependencies]
sig-core = { path = "../sig-core" }
# GPUI, its platform layer, gpui-component and the Lucide icons, at versions that fit together
gpui-kit = "0.9.0"
# the database key: macOS Keychain, Windows Credential Manager, Secret Service on Linux
keyring = "4.2"
dirs = "7"
qrcode = { version = "0.14", default-features = false }
# the core's async calls need a tokio context; the Swift app gets the same one through uniffi
async-compat = "0.2"
futures = "0.3"
hex = "0.4"
rand = "0.9"
chrono = "0.4"
# chats' pictures, decoded small (GPUI's own decoding keeps a photo's every pixel); already GPUI's
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp", "tiff", "ico", "pnm"] }
# voice and audio messages, played in the bubble from memory: GPUI has no audio (CoreAudio, WASAPI,
# ALSA through cpal; AAC/M4A, MP3, Ogg Vorbis, FLAC and WAV through Symphonia)
rodio = { version = "0.23", default-features = false, features = ["playback", "mp4", "mp3", "vorbis", "flac", "wav", "tracing"] }
# a file's type by its extension, for the files sent (already in the tree through reqwest)
mime_guess = { version = "2", default-features = false }
# warnings (ids and errors only) into the core's log
tracing = "0.1"
# links parsed as the core and the browser parse them (already the core's)
url = "2"
# only for `snapshot`: GPUI's offscreen rendering is test support (gpui-kit's own test-support
# would also pull in a second GPUI)
gpui-pre-platform = { version = "=0.3.11", optional = true }
# the tray icon and its menu (GPUI has none): the menu bar's status item on macOS, the notification
# area on Windows, and on Linux a StatusNotifierItem over D-Bus (ksni, on the zbus already here)
# rather than libappindicator's GTK
tray-icon = { version = "0.26", default-features = false, features = ["ksni"] }
# the tray's picture, drawn from a Lucide icon; already GPUI's
resvg = { version = "0.46", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
# the quarantine mark on files from chats, as the Mac app sets it
libc = "0.2"
# the Dock's unread badge (GPUI has none); already GPUI's
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSDockTile", "NSResponder"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString"] }
# the network monitor's handler (Network.framework takes a block); already GPUI's
block2 = "0.6"

[target.'cfg(windows)'.dependencies]
# Hush in the Run key, to open at login; already GPUI's
windows-registry = "0.6"
# the network's connectivity changes; already in the tree (tokio's, and gpui-kit's through smol)
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_NetworkManagement_IpHelper", "Win32_Networking_WinSock", "Win32_System_LibraryLoader"] }

[target.'cfg(not(any(target_os = "macos", windows)))'.dependencies]
# the launcher's unread count and NetworkManager's state over D-Bus (GPUI has none); already the
# keyring's Secret Service
zbus = "5"

[features]
# `--snapshot <folder>`: renders made-up screens to PNGs
snapshot = ["gpui-pre-platform/test-support"]

[dev-dependencies]
# keyring's own core (already in the tree), for its in-memory mock store
keyring-core = "1"
