[package]
name = "hush-desktop"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"

[[bin]]
name = "hush"
path = "src/main.rs"

[dependencies]
sig-core = { path = "../sig-core" }
# GPUI, its platform layer, gpui-component and the Lucide icons, at versions that fit together
gpui-kit = "0.9.0"
# the database key: macOS Keychain, Windows Credential Manager, Secret Service on Linux
keyring = "4.2"
dirs = "7"
qrcode = { version = "0.14", default-features = false }
# the core's async calls need a tokio context; the Swift app gets the same one through uniffi
async-compat = "0.2"
futures = "0.3"
hex = "0.4"
rand = "0.9"
chrono = "0.4"
# chats' pictures, decoded small (GPUI's own decoding keeps a photo's every pixel); already GPUI's
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp", "tiff", "ico", "pnm"] }
# voice and audio messages, played in the bubble from memory: GPUI has no audio (CoreAudio, WASAPI,
# ALSA through cpal; AAC/M4A, MP3, Ogg Vorbis, FLAC and WAV through Symphonia)
rodio = { version = "0.23", default-features = false, features = ["playback", "mp4", "mp3", "vorbis", "flac", "wav"] }
# only for `snapshot`: GPUI's offscreen rendering is test support (gpui-kit's own test-support
# would also pull in a second GPUI)
gpui-pre-platform = { version = "=0.3.11", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
# the quarantine mark on files from chats, as the Mac app sets it
libc = "0.2"

[features]
# `--snapshot <folder>`: renders made-up screens to PNGs
snapshot = ["gpui-pre-platform/test-support"]

[dev-dependencies]
# keyring's own core (already in the tree), for its in-memory mock store
keyring-core = "1"
